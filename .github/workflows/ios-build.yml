name: iOS Build

on:
  workflow_dispatch:
    inputs:
      capture:
        description: Native screenshot coverage
        type: choice
        options: [uniform, onboarding, home, all]
        default: uniform
      ui_tests:
        description: UI coverage (targeted confirmation after a full passing run)
        type: choice
        options: [all, onboarding]
        default: all
  pull_request:
    paths:
      - "ios/**"
      - "tools/assistant_*swift"
      - "tools/run_assistant_client_tests.js"
      - "tools/*ios_protection*"
      - "tools/capture_assistant_ios.sh"
      - ".github/workflows/ios-build.yml"
  push:
    paths:
      - "ios/**"
      - "tools/assistant_*swift"
      - "tools/run_assistant_client_tests.js"
      - "tools/*ios_protection*"
      - "tools/capture_assistant_ios.sh"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Validate bundle executable setting
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" ios/Blank/Blank/Info.plist | grep -Fx '$(EXECUTABLE_NAME)'
      - name: Test native conversation recovery
        run: |
          mkdir -p tmp/native-tests
          swiftc ios/Blank/Blank/AssistantComposerState.swift tools/assistant_composer_test.swift -o tmp/native-tests/composer
          tmp/native-tests/composer
          node tools/run_assistant_client_tests.js
          node tools/run_ios_protection_tests.js
          node tools/run_brain_native_tests.js
          node tools/run_private_stage_qa_tests.js
          swiftc ios/Blank/Blank/HomeOrbControl.swift tools/home_orb_test.swift -o tmp/native-tests/home-orb
          tmp/native-tests/home-orb
      - name: Build simulator
        id: simulator_build
        run: |
          xcodebuild \
            -project ios/Blank/Blank.xcodeproj \
            -scheme Blank \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath tmp/ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test Home navigation and long responses on iPhone
        timeout-minutes: 10
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone") and "Pro" in d["name"]))')
          suite=BlankHomeUITests
          if [ "${{ inputs.ui_tests || 'all' }}" = onboarding ]; then
            suite=BlankHomeUITests/MinimalHomeUITests/testLargestTextKeepsOnboardingActionsReachable
          fi
          xcodebuild -project ios/Blank/Blank.xcodeproj -scheme Blank \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath tmp/ios-build -resultBundlePath tmp/home-ui-tests.xcresult \
            -only-testing:"$suite" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Capture conversation states on iPhone simulator
        if: ${{ !cancelled() && steps.simulator_build.outcome == 'success' }}
        timeout-minutes: 15
        run: bash tools/capture_assistant_ios.sh tmp/ios-build/Build/Products/Debug-iphonesimulator/Blank.app tmp/ios-visual "${{ inputs.capture || 'uniform' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-conversation-visuals
          path: tmp/ios-visual/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-ui-tests
          path: tmp/home-ui-tests.xcresult/
