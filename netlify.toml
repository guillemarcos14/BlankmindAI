[build]
  publish = "web/landing"
  functions = "netlify/functions"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[functions."bmb-tick"]
  schedule = "*/5 * * * *"
